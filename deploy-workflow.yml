# GitHub Pages deployment workflow (optional).
#
# HOW TO USE: copy this file to  .github/workflows/deploy.yml  inside this repo,
# then set Settings -> Pages -> Source = "GitHub Actions".
# It could not be written there automatically because .github is a protected path
# for remote file tools. You do NOT need this file if you use the simpler
# Settings -> Pages -> "Deploy from a branch" (main, /root) option.
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON data files
        run: |
          for f in data/*.json; do
            python3 -c "import json,sys; json.load(open('$f', encoding='utf-8')); print('ok: $f')"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
